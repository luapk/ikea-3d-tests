<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spacemaxxing is lifemaxxing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; }
    #bg { position: fixed; inset: 0; z-index: 0; }
    #c  { position: fixed; inset: 0; z-index: 1; }
    .badge {
      position: fixed; z-index: 10;
      background: #fff; color: #000;
      font-weight: 900; border-radius: 0.5em;
      padding: 0.15em 0.5em;
      box-shadow: 0 4px 6px rgba(0,0,0,0.10);
      text-transform: lowercase; line-height: 1.1;
      letter-spacing: -0.01em; font-size: 1.15em;
      user-select: none; pointer-events: none;
      transition: opacity 0.26s ease, transform 0.26s ease;
    }
    #badge-hint { bottom: 1.8em; left: 1.8em; opacity: 0.55; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="c"></canvas>
  <div class="badge" id="badge-hint">press space</div>

  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }}</script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { FontLoader }    from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry }  from 'three/addons/geometries/TextGeometry.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ── Themes ────────────────────────────────────────────────────────────
    const THEMES = [
      { bgBase: '#cfe7f7', bgA: '#e5f3fa', bgB: '#b1def7', bgC: '#96c2ec' },
      { bgBase: '#c9bff0', bgA: '#dfd5ec', bgB: '#d9afdb', bgC: '#a49af2' },
    ];
    const T = THEMES[Math.random() < 0.5 ? 0 : 1];
    document.getElementById('bg').style.background =
      `radial-gradient(ellipse 60% 70% at 12% 25%, ${T.bgA} 0%, transparent 65%),` +
      `radial-gradient(ellipse 55% 65% at 85% 30%, ${T.bgC} 0%, transparent 70%),` +
      `radial-gradient(ellipse 65% 55% at 70% 95%, ${T.bgB} 0%, transparent 70%),` +
      T.bgBase;

    // ── Renderer ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    cam.position.set(0, 0, 12);
    cam.lookAt(0, 0, 0);

    // ── IBL ───────────────────────────────────────────────────────────────
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();

    // ── Objects ───────────────────────────────────────────────────────────
    const N = 9;
    const FILES = [
      'commode_ikea_hemnes.glb',    'ikea_alex_drawer_unit.glb', 'ikea_billy_small.glb',
      'ikea_hemnes_dresser.glb',    'ikea_kallax.glb',           'ikea_kallax_77x77.glb',
      'ikea_kallx147x147.glb',      'kuggis_series_box_-_ikea.glb','tobias_chair_ikea.glb',
    ];

    const pivots = Array.from({ length: N }, () => { const g = new THREE.Group(); scene.add(g); return g; });
    const loaded = new Array(N).fill(false);

    function normalise(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const sz  = box.getSize(new THREE.Vector3());
      const s   = 1.1 / Math.max(sz.x, sz.y, sz.z);
      obj.scale.setScalar(s);
      const ctr = box.getCenter(new THREE.Vector3()).multiplyScalar(s);
      obj.position.sub(ctr);
      obj.traverse(c => { if (c.isMesh) c.castShadow = true; });
    }

    // Float positions: scattered cloud in open space
    const FLOAT_POS = [
      new THREE.Vector3(-4.5,  2.0,  0.5),
      new THREE.Vector3(-2.2,  3.2,  0.0),
      new THREE.Vector3( 0.0,  3.8, -0.5),
      new THREE.Vector3( 2.2,  3.2,  0.0),
      new THREE.Vector3( 4.5,  2.0,  0.5),
      new THREE.Vector3(-3.5, -0.2,  1.0),
      new THREE.Vector3(-1.0, -2.0,  0.8),
      new THREE.Vector3( 1.5, -2.2,  0.3),
      new THREE.Vector3( 3.8, -0.5,  1.0),
    ];

    const gltfLoader = new GLTFLoader();
    FILES.forEach((file, i) => {
      gltfLoader.load(`./furniture/${file}`, gltf => {
        normalise(gltf.scene);
        pivots[i].add(gltf.scene);
        pivots[i].position.copy(FLOAT_POS[i]);
        loaded[i] = true;
      });
    });

    // ── Font & 3D text ────────────────────────────────────────────────────
    // state 0 = floating, 1 = SPACEMAXXING, 2 = IS, 3 = LIFEMAXXING
    const PHRASES = [
      null,
      { text: 'SPACEMAXXING', size: 0.75 },
      { text: 'IS',           size: 2.80 },
      { text: 'LIFEMAXXING',  size: 0.78 },
    ];

    let font      = null;
    let textMesh  = null;
    let textOpacity = 0;   // current rendered opacity
    let textTarget  = 0;   // target opacity

    const fontLoader = new FontLoader();
    fontLoader.load(
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
      f => { font = f; }
    );

    function buildText(def) {
      if (!font || !def) return null;
      const geo = new TextGeometry(def.text, {
        font,
        size: def.size,
        height: 0.13,
        curveSegments: 5,
        bevelEnabled: false,
      });
      geo.computeBoundingBox();
      const cx = (geo.boundingBox.max.x + geo.boundingBox.min.x) / 2;
      const cy = (geo.boundingBox.max.y + geo.boundingBox.min.y) / 2;
      geo.translate(-cx, -cy, 0);
      geo.computeBoundingBox();
      return new THREE.Mesh(geo,
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
    }

    // Per-word object target layouts
    function wordTargets(phraseState, bb) {
      const w = bb.max.x - bb.min.x;
      const h = bb.max.y - bb.min.y;
      if (phraseState === 1) {
        // SPACEMAXXING — arc above
        return Array.from({ length: N }, (_, i) => {
          const t = i / (N - 1);
          return new THREE.Vector3(
            -w / 2 + t * w,
            h / 2 + 1.3 + Math.sin(t * Math.PI) * 0.7,
            1.2 + (i % 2) * 0.4
          );
        });
      } else if (phraseState === 2) {
        // IS — orbit around the word
        const r = Math.max(w, h) * 0.5 + 1.8;
        return Array.from({ length: N }, (_, i) => {
          const a = (i / N) * Math.PI * 2 - Math.PI / 2;
          return new THREE.Vector3(
            Math.cos(a) * r * 1.4,
            Math.sin(a) * r,
            0.8 + (i % 3) * 0.35
          );
        });
      } else {
        // LIFEMAXXING — arc below
        return Array.from({ length: N }, (_, i) => {
          const t = i / (N - 1);
          return new THREE.Vector3(
            -w / 2 + t * w,
            -h / 2 - 1.3 - Math.sin(t * Math.PI) * 0.7,
            1.2 + (i % 2) * 0.4
          );
        });
      }
    }

    // ── State machine ─────────────────────────────────────────────────────
    let appState  = 0;   // 0–3
    let targets   = null; // Vector3[] | null
    const badgeHint = document.getElementById('badge-hint');

    function handleSpace() {
      if (!font) return;
      appState = (appState + 1) % 4;

      // Fade out + remove old text
      if (textMesh) {
        scene.remove(textMesh);
        textMesh.geometry.dispose();
        textMesh.material.dispose();
        textMesh = null;
      }
      textOpacity = 0;
      textTarget  = 0;

      if (appState > 0) {
        textMesh = buildText(PHRASES[appState]);
        if (textMesh) {
          scene.add(textMesh);
          textTarget = 1;
          targets = wordTargets(appState, textMesh.geometry.boundingBox);
        }
        badgeHint.textContent = PHRASES[appState].text.toLowerCase();
      } else {
        targets = null;
        badgeHint.textContent = 'press space';
      }
    }

    window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); handleSpace(); } });
    window.addEventListener('touchend', e => { if (e.changedTouches.length > 0) handleSpace(); });
    window.addEventListener('resize', () => {
      cam.aspect = innerWidth / innerHeight;
      cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ── Spring state ──────────────────────────────────────────────────────
    const curPos = Array.from({ length: N }, (_, i) => new THREE.Vector3().copy(FLOAT_POS[i]));
    const curVel = Array.from({ length: N }, () => new THREE.Vector3());
    const curRY  = new Float32Array(N);
    const curRYv = new Float32Array(N);

    const SK = 5.5, SD = 5, RK = 3.5, RD2 = 3.5;
    let prevT = performance.now(), elapsed = 0;

    (function tick(now) {
      requestAnimationFrame(tick);
      const dt = Math.min((now - prevT) / 1000, 0.05);
      prevT = now; elapsed += dt;

      const dF  = Math.exp(-SD   * dt);
      const rdF = Math.exp(-RD2  * dt);

      // Fade text in
      if (textMesh) {
        textOpacity += (textTarget - textOpacity) * Math.min(1, dt * 4);
        textMesh.material.opacity = textOpacity;
        // Gentle text pulse
        const s = 1 + Math.sin(elapsed * 0.9) * 0.004;
        textMesh.scale.setScalar(s);
      }

      for (let i = 0; i < N; i++) {
        if (!loaded[i]) continue;

        // Determine target
        let tx, ty, tz;
        if (targets) {
          tx = targets[i].x; ty = targets[i].y; tz = targets[i].z;
        } else {
          tx = FLOAT_POS[i].x + Math.cos(elapsed * 0.75 + i * 0.7) * 0.08;
          ty = FLOAT_POS[i].y + Math.sin(elapsed * 1.0  + i * 0.9) * 0.14;
          tz = FLOAT_POS[i].z;
        }

        // Spring position
        curVel[i].x = (curVel[i].x + (tx - curPos[i].x) * SK * dt) * dF;
        curVel[i].y = (curVel[i].y + (ty - curPos[i].y) * SK * dt) * dF;
        curVel[i].z = (curVel[i].z + (tz - curPos[i].z) * SK * dt) * dF;
        curPos[i].x += curVel[i].x * dt;
        curPos[i].y += curVel[i].y * dt;
        curPos[i].z += curVel[i].z * dt;
        pivots[i].position.copy(curPos[i]);

        // Rotation
        if (targets) {
          // Spring Y rotation toward 0 (face camera)
          let diff = -curRY[i];
          diff = ((diff + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
          curRYv[i] = (curRYv[i] + diff * RK * dt) * rdF;
          curRY[i] += curRYv[i] * dt;
          pivots[i].rotation.x += (0 - pivots[i].rotation.x) * 0.06;
          pivots[i].rotation.z += (0 - pivots[i].rotation.z) * 0.06;
        } else {
          curRY[i] += (0.3 + i * 0.018) * dt;
          pivots[i].rotation.x += (THREE.MathUtils.clamp(-curVel[i].z * 0.05, -0.2, 0.2) - pivots[i].rotation.x) * 0.1;
          pivots[i].rotation.z += (THREE.MathUtils.clamp(-curVel[i].x * 0.05, -0.2, 0.2) - pivots[i].rotation.z) * 0.1;
        }
        pivots[i].rotation.y = curRY[i];

        pivots[i].scale.setScalar(1 + Math.min(curVel[i].length() * 0.012, 0.08));
      }

      renderer.render(scene, cam);
    })(performance.now());
  </script>
</body>
</html>
