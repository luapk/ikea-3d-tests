<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>storage crunch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; cursor: none; }
    #bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 70% at 12% 25%, #dfd5ec 0%, transparent 65%),
        radial-gradient(ellipse 55% 65% at 85% 30%, #a49af2 0%, transparent 70%),
        radial-gradient(ellipse 65% 55% at 70% 95%, #d9afdb 0%, transparent 70%),
        #c9bff0;
    }
    canvas { position: fixed; inset: 0; z-index: 1; }
    .badge {
      position: fixed; z-index: 10;
      background: #fff; color: #000; font-weight: 900;
      border-radius: .5em; padding: .15em .5em;
      box-shadow: 0 4px 6px rgba(0,0,0,.1);
      text-transform: lowercase; line-height: 1.1; letter-spacing: -.01em;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      pointer-events: none; user-select: none;
    }
    #hud-score { font-size: 2.5em; top: 1.2em; right: 1.5em; }
    #hud-level { font-size: 1.2em; top: 1.2em; left: 1.5em; }
    #overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(201,191,240,.88); backdrop-filter: blur(6px);
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    #overlay.hidden { display: none; }
    .ov-title { font-size: 3.5em; font-weight: 900; letter-spacing: -.03em; margin-bottom: .25em; }
    .ov-sub   { font-size: 1.1em; color: #444; margin-bottom: 2em; text-align: center; max-width: 22em; }
    .ov-btn   {
      background: #fff; color: #000; font-weight: 900; border: none;
      border-radius: .5em; padding: .4em 1.2em; font-size: 1.4em;
      cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,.1);
      text-transform: lowercase; letter-spacing: -.01em; font-family: inherit;
    }
    .ov-btn:hover { transform: translateY(-1px); }
    #cursor {
      position: fixed; z-index: 30; width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,.9); box-shadow: 0 0 8px 2px rgba(255,255,255,.5);
      transform: translate(-50%,-50%); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="c"></canvas>
  <div class="badge" id="hud-score">0</div>
  <div class="badge" id="hud-level">level 1</div>
  <div id="cursor"></div>
  <div id="overlay">
    <div class="ov-title">storage crunch</div>
    <div class="ov-sub">slide the crate under falling objects. click to drop instantly.</div>
    <button class="ov-btn" id="btn-start">start</button>
  </div>

  <script type="importmap">
  {"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }}</script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ── Constants ─────────────────────────────────────────────────────────
    const COLS = 4;   // fewer, bigger columns
    const ROWS = 10;

    const DEFS = {
      book:    { glb:'open_book.glb',    w:1, h:1, fallMult:1.0 },
      shoe:    { glb:'trainer.glb',      w:1, h:1, fallMult:1.0 },
      hat:     { glb:'bucket_hat.glb',   w:1, h:1, fallMult:1.0 },
      iron:    { glb:'iron.glb',         w:1, h:1, fallMult:1.1 },
      football:{ glb:'football.glb',     w:1, h:1, fallMult:1.0 },
      pan:     { glb:'pan.glb',          w:2, h:1, fallMult:0.95 },
      clothes: { glb:'clothes_hang.glb', w:2, h:2, fallMult:0.85 },
    };

    // msPerRow: how many ms to drop one grid row
    const LEVELS = [
      { msPerRow:240,  types:['book','shoe','hat'] },
      { msPerRow:180,  types:['book','shoe','hat','iron','football'] },
      { msPerRow:130,  types:['book','shoe','hat','iron','football','pan'] },
      { msPerRow: 90,  types:Object.keys(DEFS) },
    ];

    // ── Renderer ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();

    // ── Camera ────────────────────────────────────────────────────────────
    // Perspective, mildly elevated — not full isometric so columns read clearly
    const cam = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
    const CX = COLS / 2;
    const CY = ROWS / 2;
    cam.position.set(CX + 3.5, CY + 5, 13);
    cam.lookAt(CX - 0.5, CY - 1.5, 0);

    // ── Lighting ──────────────────────────────────────────────────────────
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();
    scene.add(new THREE.AmbientLight(0xffffff, 2.5));
    const sun = new THREE.DirectionalLight(0xffffff, 0.4);
    sun.position.set(5, 10, 8); sun.castShadow = true;
    scene.add(sun);

    // ── Room ──────────────────────────────────────────────────────────────
    const wallMat = new THREE.MeshStandardMaterial({
      color:0xdfd5ec, transparent:true, opacity:0.4, roughness:0.95, side:THREE.DoubleSide
    });

    // Floor
    const floorMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(COLS, 1),
      new THREE.MeshStandardMaterial({ color:0xd0c4ee, roughness:0.9 })
    );
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.set(COLS / 2, 0, 0);
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // Column dividers on floor
    const divMat = new THREE.LineBasicMaterial({ color:0xa090cc, transparent:true, opacity:0.5 });
    for (let c = 0; c <= COLS; c++) {
      scene.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(c, 0.01,  0.5),
          new THREE.Vector3(c, 0.01, -0.5),
        ]), divMat
      ));
    }

    // Walls
    const bw = new THREE.Mesh(new THREE.PlaneGeometry(COLS, ROWS + 1), wallMat);
    bw.position.set(COLS / 2, ROWS / 2, -0.5);
    scene.add(bw);

    const lw = new THREE.Mesh(new THREE.PlaneGeometry(1, ROWS + 1), wallMat.clone());
    lw.rotation.y = Math.PI / 2; lw.position.set(0, ROWS / 2, 0);
    scene.add(lw);

    const rw = new THREE.Mesh(new THREE.PlaneGeometry(1, ROWS + 1), wallMat.clone());
    rw.rotation.y = -Math.PI / 2; rw.position.set(COLS, ROWS / 2, 0);
    scene.add(rw);

    // Room outline edges
    const em = new THREE.LineBasicMaterial({ color:0x9080c0, transparent:true, opacity:0.55 });
    [
      [[0,0,-0.5],[COLS,0,-0.5]], [[0,0,0.5],[COLS,0,0.5]],
      [[0,0,-0.5],[0,0,0.5]],     [[COLS,0,-0.5],[COLS,0,0.5]],
      [[0,ROWS,-0.5],[COLS,ROWS,-0.5]], [[0,ROWS,0.5],[COLS,ROWS,0.5]],
      [[0,ROWS,-0.5],[0,ROWS,0.5]],     [[COLS,ROWS,-0.5],[COLS,ROWS,0.5]],
      [[0,0,-0.5],[0,ROWS,-0.5]], [[COLS,0,-0.5],[COLS,ROWS,-0.5]],
      [[0,0,0.5],[0,ROWS,0.5]],   [[COLS,0,0.5],[COLS,ROWS,0.5]],
    ].forEach(([a,b]) => {
      scene.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]), em
      ));
    });

    // Danger plane at ceiling
    const dangerMat = new THREE.MeshBasicMaterial({
      color:0xff3333, transparent:true, opacity:0, side:THREE.DoubleSide
    });
    const dangerPlane = new THREE.Mesh(new THREE.PlaneGeometry(COLS, 1), dangerMat);
    dangerPlane.rotation.x = -Math.PI / 2;
    dangerPlane.position.set(COLS / 2, ROWS - 0.5, 0);
    scene.add(dangerPlane);

    // ── GLB loading ───────────────────────────────────────────────────────
    const glbCache = {};
    const loader   = new GLTFLoader();

    async function loadGLBs() {
      await Promise.all(Object.entries(DEFS).map(([type, def]) =>
        new Promise(res => {
          loader.load(`./objects/${def.glb}`, gltf => {
            const obj = gltf.scene;
            const box = new THREE.Box3().setFromObject(obj);
            const sz  = box.getSize(new THREE.Vector3());
            // Scale so the longest dimension fills 88% of its cell footprint
            const s = 0.88 / Math.max(sz.x / def.w, sz.y / def.h, sz.z);
            obj.scale.setScalar(s);
            obj.position.sub(box.getCenter(new THREE.Vector3()).multiplyScalar(s));
            obj.traverse(c => { if (c.isMesh) c.castShadow = true; });
            glbCache[type] = obj;
            res();
          }, undefined, () => res());
        })
      ));
    }

    function makeObjMesh(type) {
      const def = DEFS[type];
      const g = new THREE.Group();
      if (glbCache[type]) {
        g.add(glbCache[type].clone());
      } else {
        g.add(new THREE.Mesh(
          new THREE.BoxGeometry(def.w * 0.88, def.h * 0.88, 0.88),
          new THREE.MeshStandardMaterial({ color:0x8a6ed6 })
        ));
      }
      return g;
    }

    function makeCrate(w, h) {
      const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, 1));
      return new THREE.LineSegments(edges,
        new THREE.LineBasicMaterial({ color:0xffee44 })   // bright yellow — easy to see
      );
    }

    // ── Grid state ────────────────────────────────────────────────────────
    const grid = Array.from({ length:ROWS }, () => new Array(COLS).fill(null));
    const placed = {};
    let nextGid = 0;

    const placedGrp  = new THREE.Group(); scene.add(placedGrp);
    const fallingGrp = new THREE.Group(); scene.add(fallingGrp);

    let piece   = null;
    let score   = 0;
    let level   = 0;
    let lines   = 0;
    let gameOn  = false;
    let fallAcc = 0;

    // Mouse → world column via raycasting onto the game plane (z = 0)
    const raycaster = new THREE.Raycaster();
    const mouse2    = new THREE.Vector2();
    let   mouseClientX = innerWidth / 2;

    function colFromMouse(def) {
      mouse2.set((mouseClientX / innerWidth) * 2 - 1, 0);
      raycaster.setFromCamera(mouse2, cam);
      const dir  = raycaster.ray.direction;
      const orig = raycaster.ray.origin;
      const t    = -orig.z / dir.z;           // intersect z = 0 plane
      const wx   = orig.x + t * dir.x;        // world X
      return Math.max(0, Math.min(COLS - def.w, wx - def.w / 2 + 0.5));
    }

    // ── Helpers ───────────────────────────────────────────────────────────
    function landRow(col, w) {
      let top = 0;
      for (let c = col; c < col + w && c < COLS; c++)
        for (let r = ROWS - 1; r >= 0; r--)
          if (grid[r][c]) { top = Math.max(top, r + 1); break; }
      return top;
    }

    // ── Place ─────────────────────────────────────────────────────────────
    function placePiece() {
      if (!piece) return;
      const def = DEFS[piece.type];
      const col = Math.round(Math.max(0, Math.min(COLS - def.w, piece.col)));
      const row = landRow(col, def.w);

      if (row + def.h > ROWS) { endGame(); return; }

      const gid = nextGid++;
      for (let r = row; r < row + def.h; r++)
        for (let c = col; c < col + def.w; c++)
          if (c < COLS) grid[r][c] = { type:piece.type, gid };

      const g = new THREE.Group();
      g.position.set(col + def.w / 2, row + def.h / 2, 0);
      g.add(makeObjMesh(piece.type));
      placedGrp.add(g);
      placed[gid] = g;

      score += 10;
      const cleared = clearRows();
      score += [0, 50, 120, 200][Math.min(cleared, 3)];
      lines += cleared;
      level = Math.min(Math.floor(lines / 5), LEVELS.length - 1);

      updateHUD();
      fallingGrp.clear();
      piece = null;

      if (grid[ROWS - 1].some(c => c)) { endGame(); return; }
      spawnPiece();
    }

    function clearRows() {
      let n = 0;
      for (let r = 0; r < ROWS; r++) {
        if (!grid[r].every(Boolean)) continue;
        const gids = new Set(grid[r].filter(Boolean).map(c => c.gid));
        // Remove those gids from entire grid
        for (let row2 = 0; row2 < ROWS; row2++)
          for (let col2 = 0; col2 < COLS; col2++)
            if (gids.has(grid[row2][col2]?.gid)) grid[row2][col2] = null;
        gids.forEach(gid => {
          if (placed[gid]) { placedGrp.remove(placed[gid]); delete placed[gid]; }
        });
        grid.splice(r, 1);
        grid.push(new Array(COLS).fill(null));
        n++; r--;
      }
      if (n) rebuildPlaced();
      return n;
    }

    function rebuildPlaced() {
      while (placedGrp.children.length) placedGrp.remove(placedGrp.children[0]);
      Object.keys(placed).forEach(k => delete placed[k]);
      const seen = new Set();
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = grid[r][c];
          if (!cell || seen.has(cell.gid)) continue;
          seen.add(cell.gid);
          const def = DEFS[cell.type];
          const g = new THREE.Group();
          g.position.set(c + def.w / 2, r + def.h / 2, 0);
          g.add(makeObjMesh(cell.type));
          placedGrp.add(g);
          placed[cell.gid] = g;
        }
      }
    }

    // ── Spawn ─────────────────────────────────────────────────────────────
    function spawnPiece() {
      if (!gameOn) return;
      const cfg  = LEVELS[level];
      const type = cfg.types[Math.floor(Math.random() * cfg.types.length)];
      const def  = DEFS[type];
      const col  = Math.floor((COLS - def.w) / 2);

      if (landRow(col, def.w) + def.h > ROWS) { endGame(); return; }

      const crate   = makeCrate(def.w, def.h);
      const objMesh = makeObjMesh(type);
      const shadow  = new THREE.Mesh(
        new THREE.PlaneGeometry(def.w * 0.88, 1),
        new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0, depthWrite:false, side:THREE.DoubleSide })
      );
      shadow.rotation.x = -Math.PI / 2;

      const grp = new THREE.Group();
      grp.add(crate); grp.add(objMesh); grp.add(shadow);
      fallingGrp.add(grp);

      piece = { type, def, col, y: ROWS + 1, grp, objMesh, shadow };
      fallAcc = 0;
    }

    // ── Input ─────────────────────────────────────────────────────────────
    const cursorEl = document.getElementById('cursor');

    window.addEventListener('mousemove', e => {
      cursorEl.style.left = e.clientX + 'px';
      cursorEl.style.top  = e.clientY + 'px';
      mouseClientX = e.clientX;
    });

    window.addEventListener('click', () => { if (gameOn && piece) placePiece(); });

    window.addEventListener('keydown', e => {
      if (!gameOn || !piece) return;
      const def = DEFS[piece.type];
      if (e.key === 'ArrowLeft')  piece.col = Math.max(0, Math.round(piece.col) - 1);
      if (e.key === 'ArrowRight') piece.col = Math.min(COLS - def.w, Math.round(piece.col) + 1);
      if ([' ', 'ArrowDown', 'Enter'].includes(e.key)) placePiece();
    });

    // ── HUD ───────────────────────────────────────────────────────────────
    function updateHUD() {
      document.getElementById('hud-score').textContent = score;
      document.getElementById('hud-level').textContent = `level ${level + 1}`;
    }

    // ── Game control ──────────────────────────────────────────────────────
    function startGame() {
      for (let r = 0; r < ROWS; r++) grid[r].fill(null);
      while (placedGrp.children.length) placedGrp.remove(placedGrp.children[0]);
      Object.keys(placed).forEach(k => delete placed[k]);
      fallingGrp.clear();
      piece = null; score = 0; level = 0; lines = 0;
      gameOn = true;
      updateHUD();
      document.getElementById('overlay').classList.add('hidden');
      spawnPiece();
    }

    const QUIPS = [
      'have you considered a bigger flat?',
      'the hallway is not a storage solution.',
      'KALLAX would have prevented this.',
      'under-bed storage. look into it.',
      'a PAX wardrobe is just a tall crate, legally.',
    ];

    function endGame() {
      gameOn = false; fallingGrp.clear(); piece = null;
      const el = document.getElementById('overlay');
      el.querySelector('.ov-title').textContent = `${score} pts`;
      el.querySelector('.ov-sub').textContent =
        `${lines} layers cleared. ` + QUIPS[Math.floor(Math.random() * QUIPS.length)];
      el.querySelector('.ov-btn').textContent = 'play again';
      el.classList.remove('hidden');
    }

    document.getElementById('btn-start').addEventListener('click', startGame);

    // ── Render loop ───────────────────────────────────────────────────────
    let prevT = performance.now(), elapsed = 0;

    (function tick(now) {
      requestAnimationFrame(tick);
      const dt = Math.min((now - prevT) / 1000, 0.05);
      prevT = now; elapsed += dt;

      if (gameOn && piece) {
        const def = DEFS[piece.type];

        // Mouse → column via raycast (accurate in any camera angle)
        const targetCol = colFromMouse(def);
        piece.col += (targetCol - piece.col) * 0.3;

        // Gravity
        fallAcc += dt * 1000;
        const interval = LEVELS[level].msPerRow / def.fallMult;
        while (fallAcc >= interval) {
          fallAcc -= interval;
          piece.y -= 1;
        }

        // Check landing
        const sc   = Math.round(Math.max(0, Math.min(COLS - def.w, piece.col)));
        const land = landRow(sc, def.w);
        if (piece.y <= land) {
          piece.col = sc;
          piece.y   = land;
          placePiece();
          return;
        }

        // Update position
        piece.grp.position.set(piece.col + def.w / 2, piece.y + def.h / 2, 0);
        piece.objMesh.rotation.y = elapsed * 0.4;

        // Drop shadow at landing row
        piece.shadow.position.set(0, land - piece.y - def.h / 2 + 0.05, 0);
        piece.shadow.material.opacity = 0.05 + 0.18 * Math.max(0, 1 - (piece.y - land) / 7);
      }

      // Ceiling danger pulse
      let maxH = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].some(Boolean)) { maxH = r + 1; break; }
      }
      dangerMat.opacity = maxH > ROWS * 0.65
        ? 0.07 + 0.1 * (0.5 + 0.5 * Math.sin(elapsed * 6))
        : 0;

      renderer.render(scene, cam);
    })(performance.now());

    // ── Resize ────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      cam.aspect = innerWidth / innerHeight;
      cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ── Boot ──────────────────────────────────────────────────────────────
    await loadGLBs();
  </script>
</body>
</html>
